[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regression-records"
version = "0.1.0"
description = "Record and regression-test Python function and method executions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["testing", "regression", "golden-master", "characterization", "snapshot"]
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
pandas = ["pandas>=2.0", "pyarrow>=14.0"]
test = ["pytest>=7.0", "polars>=0.20", "pandas>=2.0", "pyarrow>=14.0"]

[project.urls]
Homepage = "https://github.com/ronaldBuddys/regression-records"
Repository = "https://github.com/ronaldBuddys/regression-records"
Issues = "https://github.com/ronaldBuddys/regression-records/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/regression_records"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "plan.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
