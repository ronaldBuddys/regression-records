[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regression-records"
version = "0.1.0"
description = "Record and regression-test Python function and method executions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
pandas = ["pandas>=2.0", "pyarrow>=14.0"]
test = ["pytest>=7.0", "polars>=0.20", "pandas>=2.0", "pyarrow>=14.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/regression_records"]

[tool.pytest.ini_options]
testpaths = ["tests"]
