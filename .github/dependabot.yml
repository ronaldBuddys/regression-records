# Version updates. Security updates are a repository setting, not configured here.
version: 2
updates:
  # The actions are pinned by commit SHA, so nothing moves unless this proposes it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ":arrow_up:"

  # uv.lock pins every package, extras and the dev group included. Monthly and grouped
  # into one PR, because consumers lock this repository by commit and a stream of
  # single-package bumps would only churn their locks.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: ":arrow_up:"
