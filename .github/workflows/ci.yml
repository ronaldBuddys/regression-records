name: CI

on:
  pull_request:
  # No push to main: the PR's run already tested what the merge lands, and repeating
  # it after every merge was over a third of the account's Actions minutes. To check
  # main itself, run this workflow by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read this repository, which has no git dependencies.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest versions the classifiers claim. The sibling repos test
        # one; this one tests both ends because recording an object by its state
        # depends on interpreter behaviour (`object.__getstate__`), and a suite that
        # was green on the development version once hid five failures on the declared
        # floor. The versions in between are left out to save Actions minutes: a
        # behaviour change there shows up at one end or the other.
        python-version: ["3.11", "3.14"]
        # Lint runs on one leg only: ruff does not depend on the interpreter, and a
        # job of its own was billed a whole minute for ten seconds of work.
        include:
          - python-version: "3.14"
            lint: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install
        id: install
        run: uv sync --locked

      # Lint, format and tests each run once the install succeeded, whatever the
      # others did, so one push reports every kind of failure.
      - name: Lint
        if: ${{ matrix.lint && !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff check .

      - name: Format
        if: ${{ matrix.lint && !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff format --check .

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync pytest

  floors:
    # The oldest releases pyproject.toml admits (numpy 1.24, pandas 2.0, polars 1.20,
    # pyarrow 14, pytest 8.0), on the oldest Python. The lock resolves the newest, so
    # without this leg a declared floor is a claim nothing checks; the first run found
    # nullable pandas columns failing on pandas 2.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: pyproject.toml

      # Re-resolves rather than installing the lock, which pins the newest releases.
      - name: Install the declared floors
        run: uv sync --resolution lowest-direct

      - name: Tests
        run: uv run --no-sync pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      # --all-extras, not just docs: the examples run during the build, and the
      # dataframe ones need polars and pandas.
      - name: Install
        run: uv sync --locked --all-extras

      - name: Build docs
        # -W: warnings are errors. Examples are executed here; see docs/building.rst.
        run: uv run make -C docs html

      - name: Upload the built docs
        # No hosting (a Pages site from a private repo is public); the HTML is a
        # private artifact on the run, for a reviewer to download and open.
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14
