name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read this repository. The private siblings are
# fetched with SIBLING_CHECKOUT_TOKEN, never with GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the classifiers claim. The sibling repos test one; this one
        # tests them all because recording an object by its state depends on
        # interpreter behaviour (`object.__getstate__`), and a suite that was green
        # on the development version once hid five failures on the declared floor.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked

      - name: Tests
        run: uv run pytest

  floors:
    # The oldest releases pyproject.toml admits (numpy 1.24, pandas 2.0, polars 1.20,
    # pyarrow 14, pytest 8.0), on the oldest Python. The lock resolves the newest, so
    # without this leg a declared floor is a claim nothing checks; the first run found
    # nullable pandas columns failing on pandas 2.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: pyproject.toml

      # Re-resolves rather than installing the lock, which pins the newest releases.
      - name: Install the declared floors
        run: uv sync --resolution lowest-direct

      - name: Tests
        run: uv run --no-sync pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      # --all-extras, not just docs: the examples run during the build, and the
      # dataframe ones need polars and pandas.
      - name: Install
        run: uv sync --locked --all-extras

      - name: Build docs
        # -W: warnings are errors. Examples are executed here; see docs/building.rst.
        run: uv run make -C docs html
